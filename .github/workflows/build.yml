name: Flutter APK Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "GitHub Release asset API URL untuk ZIP project Flutter"
        required: true
        type: string
      tag:
        description: "Tag build"
        required: true
        type: string
      build_type:
        description: "Tipe APK"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read
  actions: read

concurrency:
  group: flutter-build-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download project ZIP
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/input"
          echo "Downloading project ZIP..."
          echo "URL: $ZIP_URL"

          HTTP_CODE=$(curl --silent --show-error --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ZIP_URL" -o "$GITHUB_WORKSPACE/input/project.zip" || true)

          if [ ! -s "$GITHUB_WORKSPACE/input/project.zip" ] || [ "${HTTP_CODE:-0}" = "403" ] || [ "${HTTP_CODE:-0}" = "404" ]; then
            echo "First attempt failed (HTTP ${HTTP_CODE:-unknown}). Retrying..."
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ZIP_URL" -o "$GITHUB_WORKSPACE/input/project.zip"
          fi

          test -s "$GITHUB_WORKSPACE/input/project.zip"
          file "$GITHUB_WORKSPACE/input/project.zip" || true
          ls -lah "$GITHUB_WORKSPACE/input/project.zip"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$GITHUB_WORKSPACE/input/project.zip" -d "$GITHUB_WORKSPACE/project"

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC="$(find "$GITHUB_WORKSPACE/project" -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Ensure compatible Gradle wrapper version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          # Banyak project ZIP yang di-upload user pakai versi Gradle lama
          # (mis. 8.12.0), padahal Flutter stable sekarang butuh minimal
          # Gradle 8.14.0. Daripada gagal di step build, paksa naikkan
          # versinya di sini dulu supaya kompatibel dengan Flutter Gradle
          # plugin, apapun versi bawaan project-nya.
          if [ -f "$WRAPPER_PROPS" ]; then
            echo "Sebelum:"; grep distributionUrl "$WRAPPER_PROPS" || true
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.2-all.zip#' "$WRAPPER_PROPS"
            echo "Sesudah:"; grep distributionUrl "$WRAPPER_PROPS" || true
          else
            echo "gradle-wrapper.properties tidak ditemukan di $WRAPPER_PROPS, lewati step ini (mungkin belum pernah build android sama sekali)."
          fi

      - name: Ensure compatible Android Gradle Plugin (AGP) version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          MIN_AGP="8.11.1"
          # Sama seperti versi Gradle: AGP versi lama (mis. 8.9.1) di project
          # yang di-upload user bisa lebih rendah dari minimum yang didukung
          # Flutter. AGP versi didefinisikan di salah satu dari beberapa
          # kemungkinan file tergantung template project (settings.gradle(.kts)
          # dengan blok plugins, atau top-level build.gradle(.kts) dengan
          # classpath com.android.tools.build:gradle). Cek semuanya dan paksa
          # naikkan ke versi minimum, apapun versi bawaannya.
          FILES=$(find android -maxdepth 1 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null || true)
          for f in $FILES; do
            if grep -qE "com\.android\.application[\"']?\)?[[:space:]]+version[[:space:]]+[\"'][0-9]+\.[0-9]+\.[0-9]+[\"']" "$f"; then
              echo "Patch AGP (plugins block) di $f"
              sed -i -E "s#(com\.android\.application[\"']?\)?[[:space:]]+version[[:space:]]+[\"'])[0-9]+\.[0-9]+\.[0-9]+([\"'])#\1${MIN_AGP}\2#" "$f"
            fi
            if grep -qE "com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+" "$f"; then
              echo "Patch AGP (classpath) di $f"
              sed -i -E "s#(com\.android\.tools\.build:gradle:)[0-9]+\.[0-9]+\.[0-9]+#\1${MIN_AGP}#" "$f"
            fi
          done
          echo "Selesai cek versi AGP."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          echo "[RESULT_ANALYZE]"
          flutter analyze --no-fatal-infos || true
          echo "[END_RESULT_ANALYZE]"

      - name: Build release APK
        if: inputs.build_type == 'release'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"

      - name: Show build failure details
        if: failure()
        shell: bash
        run: |
          echo "::group::Tail of flutter build output"
          if [ -f "$GITHUB_WORKSPACE/build-output.log" ]; then
            tail -n 150 "$GITHUB_WORKSPACE/build-output.log"
          else
            echo "build-output.log tidak ditemukan (build gagal sebelum sempat menulis log)."
          fi
          echo "::endgroup::"

      - name: Upload build log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.build_type }}-${{ inputs.tag }}
          path: ${{ github.workspace }}/build-output.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$PROJECT_DIR/build/app/outputs/flutter-apk" -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          if ! find "$GITHUB_WORKSPACE/apk-output" -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::APK tidak ditemukan setelah build."
            exit 1
          fi
          ls -lah "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_type }}-${{ inputs.tag }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 1
