name: build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct download URL to the Flutter project ZIP (GitHub release asset)'
        required: true
        type: string
      tag:
        description: 'Build/release tag (from bot genTag)'
        required: true
        type: string
      build_type:
        description: 'Build type'
        required: false
        type: choice
        options:
          - debug
          - release
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo (ambil script auto-fix)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download project ZIP
        run: |
          set -e
          echo "Downloading: ${{ github.event.inputs.zip_url }}"
          curl -fL --retry 3 --retry-delay 5 -o project.zip "${{ github.event.inputs.zip_url }}"
          if [ ! -s project.zip ]; then
            echo "::error::Gagal download ZIP dari zip_url (file kosong / link mati)."
            exit 1
          fi

      - name: Extract project
        run: |
          set -e
          mkdir -p project
          unzip -oq project.zip -d project
          rm -f project.zip

      - name: Locate Flutter project (pubspec.yaml)
        id: locate
        run: |
          set -e
          PUBSPEC_PATH=$(find project -maxdepth 5 -iname "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP. Ini bukan project Flutter yang valid."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Ditemukan project Flutter di: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Auto-fix konfigurasi Gradle/Kotlin DSL yang umum bikin gagal
        run: python3 .github/workflows/scripts/autofix_gradle.py "${{ steps.locate.outputs.dir }}"

      - name: flutter pub get (dengan fallback upgrade kalau gagal)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -e
          if ! flutter pub get; then
            echo "⚠️  pub get gagal, coba flutter pub upgrade --major-versions sebagai fallback..."
            flutter pub upgrade --major-versions
            flutter pub get
          fi

      - name: Build APK
        id: build
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug 2>&1 | tee /tmp/build.log
          else
            flutter build apk --release 2>&1 | tee /tmp/build.log
          fi

      - name: Upload log build (selalu, buat debug kalau gagal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.tag }}
          path: /tmp/build.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Gagalkan job kalau build APK memang gagal
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Build APK gagal. Ini kemungkinan besar error asli di project Flutter yang di-upload (bukan masalah workflow) — cek artifact 'build-log-${{ github.event.inputs.tag }}' buat detail lengkapnya."
          tail -n 60 /tmp/build.log || true
          exit 1

      - name: Locate built APK
        id: apk
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -e
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          else
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          fi
          if [ ! -f "$APK_PATH" ]; then
            FOUND=$(find build -iname "*.apk" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "::error::File APK hasil build tidak ditemukan."
              exit 1
            fi
            APK_PATH="$FOUND"
          fi
          echo "APK ada di: $APK_PATH"
          echo "path=${{ steps.locate.outputs.dir }}/$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ github.event.inputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 3
          if-no-files-found: error
